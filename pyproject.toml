[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexweb"
version = "4.2.3"
dependencies = [
  "pypdf",
  "importlib_resources",
  "beautifulsoup4",
  "mammoth"
]
authors = [
  { name="Noorul Ali", email="manonthemoon13131@gmail.com" },
]
description = "Dexweb makes dex, a programmatically generated website, to put on the web. Latest release: v4.2.3. Adds dex publishing with dexweb.Dexweb().publish()."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://alinoorul.github.io/researchengine"
Issues = "https://github.com/matrixdex/dexweb/issues"
Documentation = "https://matrixdex.github.io/dexweb"
Repository = "https://github.com/matrixdex/dexweb"
